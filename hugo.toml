baseURL = "https://maebzh.github.io/le-hangar-a-bananes/"
locale = "fr-FR"
defaultContentLanguage = "fr"
title = "Le hangar à bananes"
theme = "PaperMod"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[pagination]
  pagerSize = 30

[params]
  mainSections = ["etapes"]
  # Nombre de phases du chantier ; le billet de poids supérieur est le bilan.
  nbPhases = 10
  images = ["logo.png"]
  description = "49 m² de garage-atelier en ossature bois, construits à deux, le week-end : le chantier raconté étape par étape."
  defaultTheme = "light"
  disableThemeToggle = true
  ShowReadingTime = true
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  dateFormat = "January 2006"
  [params.footer]
    text = "[Mentions légales](/mentions-legales/)"
  [params.assets]
    favicon = "favicon-32x32.png"
    favicon16x16 = "favicon-16x16.png"
    favicon32x32 = "favicon-32x32.png"
    apple_touch_icon = "apple-touch-icon.png"
  [params.label]
    icon = "logo-mark.png"
    iconHeight = 36
  [params.homeInfoParams]
    Title = "49 m² de garage-atelier, construits à deux"
    Content = "Un garage en ossature bois, monté le week-end, du terrain vide jusqu’à l’atelier. Nos choix, nos erreurs, nos chiffres, et un conseil concret à chaque étape."

[menu]
  [[menu.main]]
    name = "Les étapes"
    pageRef = "/etapes"
    weight = 1
  [[menu.main]]
    name = "Fiche technique"
    pageRef = "/fiche-technique"
    weight = 2
  [[menu.main]]
    name = "Outils"
    pageRef = "/outils"
    weight = 3
  [[menu.main]]
    name = "Lexique"
    pageRef = "/lexique"
    weight = 4
  [[menu.main]]
    name = "À propos"
    pageRef = "/a-propos"
    weight = 5

# Liens Markdown internes (/etapes/…) résolus par Hugo, sous-dossier de baseURL compris.
[markup.goldmark.renderHooks.link]
  useEmbedded = "always"
