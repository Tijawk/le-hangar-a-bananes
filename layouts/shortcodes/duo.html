{{- define "duo-img" -}}
{{- $img := .page.Resources.Get .src -}}
{{- if $img -}}
{{- $m := $img.Resize "720x webp q80" -}}
<a href="{{ $img.RelPermalink }}" class="zoom" title="Agrandir"><img src="{{ $m.RelPermalink }}" width="{{ $m.Width }}" height="{{ $m.Height }}" alt="{{ .alt }}" loading="lazy" decoding="async"></a>
{{- else -}}<img src="{{ .src }}" alt="{{ .alt }}" loading="lazy">{{- end -}}
{{- end -}}
<figure class="duo">
  <div class="duo-grille">
    <div><p class="duo-etiquette">La théorie</p>{{ template "duo-img" (dict "page" .Page "src" (.Get "theorie") "alt" (.Get "alt-theorie")) }}</div>
    <div><p class="duo-etiquette">En vrai</p>{{ template "duo-img" (dict "page" .Page "src" (.Get "vrai") "alt" (.Get "alt-vrai")) }}</div>
  </div>
  {{- with .Get "legende" }}<figcaption>{{ . | markdownify }}</figcaption>{{ end }}
</figure>
