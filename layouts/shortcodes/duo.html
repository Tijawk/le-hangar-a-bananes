<figure class="duo">
  <div class="duo-grille">
    <div><p class="duo-etiquette">La théorie</p><a href="{{ .Get "theorie" }}" target="_blank" rel="noopener" title="Agrandir le schéma"><img src="{{ .Get "theorie" }}" alt="{{ .Get "alt-theorie" }}" loading="lazy"></a></div>
    <div><p class="duo-etiquette">En vrai</p><a href="{{ .Get "vrai" }}" target="_blank" rel="noopener" title="Agrandir la photo"><img src="{{ .Get "vrai" }}" alt="{{ .Get "alt-vrai" }}" loading="lazy"></a></div>
  </div>
  {{- with .Get "legende" }}<figcaption>{{ . | markdownify }} <span class="duo-zoom">Cliquez sur une image pour l’agrandir.</span></figcaption>{{ end }}
</figure>
