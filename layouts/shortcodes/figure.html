{{- $src := .Get "src" -}}
{{- $img := .Page.Resources.Get $src -}}
<figure>
{{- if and $img (in (slice "image/jpeg" "image/png") $img.MediaType.Type) -}}
  {{- $s := $img.Resize "600x webp q78" -}}
  {{- $m := $img -}}{{- if gt $img.Width 1200 }}{{ $m = $img.Resize "1200x webp q78" }}{{ else }}{{ $m = $img.Resize (printf "%dx webp q78" $img.Width) }}{{ end -}}
  <a href="{{ $img.RelPermalink }}" class="zoom" title="Agrandir l’image"><img src="{{ $m.RelPermalink }}" srcset="{{ $s.RelPermalink }} 600w, {{ $m.RelPermalink }} {{ $m.Width }}w" sizes="(max-width: 800px) 100vw, 760px" width="{{ $m.Width }}" height="{{ $m.Height }}" alt="{{ .Get "alt" }}" loading="lazy" decoding="async"></a>
{{- else -}}
  <img src="{{ $src }}" alt="{{ .Get "alt" }}" loading="lazy">
{{- end -}}
{{- with .Get "caption" }}<figcaption>{{ . | markdownify }}</figcaption>{{ end }}
</figure>
