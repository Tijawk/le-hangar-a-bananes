{{- $n := int (.Get "phase") -}}
{{- $total := 10 -}}
<div class="frise" aria-label="{{ if gt $n $total }}Bilan du chantier{{ else }}Phase {{ $n }} sur {{ $total }}{{ end }}">
{{- range $i := seq $total -}}<span class="{{ if lt $i $n }}fait{{ else if eq $i $n }}en-cours{{ end }}"></span>{{- end -}}
</div>
<p class="phase">{{ if gt $n $total }}Le chantier terminé{{ else }}Phase {{ $n }} sur {{ $total }}{{ end }} · {{ .Get "titre" }}</p>
